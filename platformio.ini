[env:vest_s3_dev]
extends = env:_atom_s3
build_flags =
  ${env:_atom_s3.build_flags}
  -DJL_CONFIG=VEST
  -DBOOT_NAME=DEV-S3
  -DJL_DEV=1

# ATOM S3 debug vest build for stepping though code.
[env:vest_s3_debug]
extends = env:vest_s3_dev
debug_tool = esp-builtin
debug_speed = 12000
build_type = debug
build_flags =
  ${env:vest_s3_dev.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=DEBUG-S3'
  -DCORE_DEBUG_LEVEL=5
  -DARDUINO_USB_MODE=1
  -DJL_DEBUG=1

