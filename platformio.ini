[platformio]
# These default envs are built when running `pio run`.
# Note that GitHub Actions use a different list in `jazzlights.yml`.
default_envs =
  vest
  vest_dev
  vest_instrumentation
  clouds_s3_debug
  gauntlet
  native

# Settings shared by all platforms.
[env]
test_build_src = true
extra_scripts =
  post:extras/site/flash/merge-bin.py
  post:extras/scripts/sleep_post_upload.py
check_flags =
  cppcheck: --suppress=*:*/.platformio/packages/*
check_skip_packages = yes

# Shared production build parameters for embedded arduino devices. Will not build on its own.
[env:_arduino]
framework = arduino
# The official espressif32 platform from platformio is no longer tracking updates to ESP-IDF or the espressif
# Arduino core, so it is stuck on ESP-IDF v4 and the Arduino core v2. We instead use the unofficial pioarduino
# platform which is kept in sync. More details here:
# https://github.com/platformio/platform-espressif32/issues/1225
# Pin to 53.03.10 because more recent versions fail. 54.* fails to upload, 55.* fails to find <esp_gap_ble_api.h>.
# TODO: figure out why that is and upgrade to 55.*
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
upload_speed = 115200
monitor_speed = 115200
debug_tool = olimex-arm-usb-ocd-h
# Unfortunately upload_port and monitor_port don't natively support regexes, but hwgrep does.
# For some reason the characters '*', '?', '[', and ']' don't work in hwgrep, so we improvised.
# macOS uses /dev/cu.usbserial-.+, Linux uses /dev/ttyUSB.+ and Windows uses COM.+
upload_port = hwgrep://^(/dev/cu\.usbserial-.+|/dev/ttyUSB.+|COM.+)$
monitor_port = ${this.upload_port}
lib_deps =
  fastled/FastLED@3.10.3
build_flags =
  -Werror=format
  # We never catch exceptions, and disabling them saves around 40KB of flash. This must match
  # CONFIG_COMPILER_CXX_EXCEPTIONS in sdkconfig.defaults for environments that use `framework = espidf, arduino`.
  -fno-exceptions
# Link-time optimization saves 8-27KB of flash depending on the environment. See extras/scripts/lto.py.
build_src_flags = -flto=auto
extra_scripts =
  ${env.extra_scripts}
  post:extras/scripts/lto.py
build_unflags =
  -fexceptions

# The prebuilt Arduino core wraps the logging functions so esp_diagnostics can feed log messages to ESP Insights, which
# we don't use. Removing the wrapping saves about 2KB of flash on ESP32 environments that use `framework = arduino`.
# We don't do this on ESP32-S3 or RISC-V, where it makes the binary larger.
[_esp32_no_log_wrap]
build_unflags =
  ${env:_arduino.build_unflags}
  -Wl,--wrap=esp_log_write
  -Wl,--wrap=esp_log_writev
  -Wl,--wrap=log_printf

[_lib_m5unified]
lib_deps = m5stack/M5Unified@0.2.13

[_lib_m5pm1]
lib_deps = m5stack/M5PM1@1.0.6

[_lib_espasyncwebserver]
lib_deps = ESP32Async/ESPAsyncWebServer@3.10.0

# Settings for environments that use Esp32NimBleNetwork with `framework = arduino`. The prebuilt ESP-IDF libraries in
# the Arduino core have Bluedroid enabled, so we get NimBLE from the NimBLE-Arduino library instead.
[_nimble_arduino]
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags =
  -DJL_ESP32_NIMBLE=1
  # We only scan and advertise, so we never need the central role or more than one connection.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  # We never pair, so we don't need the security manager.
  -DMYNEWT_VAL_BLE_SM_LEGACY=0
  -DMYNEWT_VAL_BLE_SM_SC=0
  # Match the stack size of the Bluedroid task that runs Esp32BleNetwork callbacks.
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

# Custom sdkconfig defaults.
# https://github.com/platformio/platform-espressif32/issues/638
# https://docs.espressif.com/projects/esp-idf/en/release-v5.2/esp32/api-guides/build-system.html#custom-sdkconfig-defaults
[_sdkconfig_instrumentation]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.instrumentation.defaults"

[_sdkconfig_iram]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.iram.defaults"

[_sdkconfig_instrumentation_iram]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.instrumentation.defaults;sdkconfig.iram.defaults"

# Replaces Bluedroid with NimBLE, for environments that use Esp32NimBleNetwork with `framework = espidf, arduino`.
[_sdkconfig_iram_nimble]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.iram.defaults;sdkconfig.nimble.defaults"

# Replaces Bluedroid with NimBLE, for environments that use Esp32NimBleNetwork with `framework = espidf`.
[_sdkconfig_iram_nimble_idf]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.iram.defaults;sdkconfig.nimble.defaults;sdkconfig.idf.defaults"

# Settings for environments that use `framework = espidf` without the Arduino core. FastLED declares that it requires
# the Arduino core, so we disable PlatformIO's library compatibility check and provide what FastLED needs via a shim.
[_idf]
framework = espidf
lib_compat_mode = off
extra_scripts =
  ${env:_arduino.extra_scripts}
  pre:extras/scripts/fastled_idf_shim.py

[env:_espidf]
extends = env:_arduino
framework = espidf, arduino
board_build.embed_txtfiles =
  managed_components/espressif__esp_insights/server_certs/https_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:_legacy_arduino_core]
extends = env:_arduino
platform = espressif32 @ <50

[env:_legacy_arduino_core_espidf]
extends = env:_legacy_arduino_core
framework = ${env:_espidf.framework}
board_build.embed_txtfiles = ${env:_espidf.board_build.embed_txtfiles}

# Shared production build parameters for various m5stack boards. Will not build on its own.
[env:_atom]
extends = env:_arduino
board = m5stack-atom
upload_speed = 1500000
build_unflags = ${_esp32_no_log_wrap.build_unflags}
monitor_filters = esp32_exception_decoder, time
upload_port = hwgrep://^(/dev/cu\.usbserial-.{10}|/dev/ttyUSB.+|COM.+)$
monitor_port = ${this.upload_port}
board_build.partitions = partition_tables/4MB_app1920KB_fs128KB_OTA.csv

# ATOM Matrix production build parameters. Will not build on its own.
[env:_atom_matrix]
extends = env:_atom
build_flags =
  ${env:_atom.build_flags}
  -DJL_CONTROLLER=ATOM_MATRIX

# ATOM Matrix production vest build.
[env:vest]
extends = env:_atom_matrix
build_flags =
  ${env:_atom_matrix.build_flags}
  -DJL_CONFIG=VEST
  -DBOOT_NAME=VEST

# ATOM Matrix build designed to boot into the calibration mode suitable for assembling vests.
[env:vest_calibrate]
extends = env:_atom_matrix
build_flags =
  ${env:_atom_matrix.build_flags}
  -DJL_CONFIG=VEST
  -DBOOT_NAME=FAB
  -DJL_START_SPECIAL=1
  -DJL_BUTTON_LOCK=0

# ATOM Matrix development vest build.
# Uses lower LED brightness to not overload computer USB, and disables button lock.
[env:vest_dev]
extends = env:_atom_matrix
build_flags =
  ${env:_atom_matrix.build_flags}
  -DJL_CONFIG=VEST
  -DBOOT_NAME=DEV
  -DJL_DEV=1

# ATOM Matrix development vest build that saves and logs timing information about the arduino loop.
[env:vest_timing]
extends = env:vest_dev
build_flags =
  ${env:vest_dev.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=TIMING'
  -DJL_TIMING=1

[env:vest_espidf]
extends = env:vest
framework = ${env:_espidf.framework}
board_build.embed_txtfiles = ${env:_espidf.board_build.embed_txtfiles}
board_build.cmake_extra_args = ${_sdkconfig_iram.board_build.cmake_extra_args}

# Same as vest_espidf but uses NimBLE from ESP-IDF instead of Bluedroid.
[env:vest_espidf_nimble]
extends = env:vest_espidf
board_build.cmake_extra_args = ${_sdkconfig_iram_nimble.board_build.cmake_extra_args}
build_flags =
  ${env:vest_espidf.build_flags}
  -DJL_ESP32_NIMBLE=1
  '-UBOOT_NAME -DBOOT_NAME=VEST-IDF-NIMBLE'

[env:vest_espidf_nimble_no_wifi]
extends = env:vest_espidf_nimble
build_flags =
  ${env:vest_espidf_nimble.build_flags}
  -DJL_WIFI=0
  '-UBOOT_NAME -DBOOT_NAME=VEST-IDF-NIMBLE-NO-WIFI'

# Same as vest_espidf_nimble but without the Arduino core, which requires using Esp32WiFiNetwork for Wi-Fi.
[env:vest_idf]
extends = env:vest
framework = ${_idf.framework}
lib_compat_mode = ${_idf.lib_compat_mode}
extra_scripts = ${_idf.extra_scripts}
board_build.cmake_extra_args = ${_sdkconfig_iram_nimble_idf.board_build.cmake_extra_args}
build_flags =
  ${env:vest.build_flags}
  -DJL_ESP32_NIMBLE=1
  -DJL_ESP32_WIFI=1
  '-UBOOT_NAME -DBOOT_NAME=VEST-IDF'

# Same as vest_espidf_nimble_no_wifi but without the Arduino core.
[env:vest_idf_no_wifi]
extends = env:vest_idf
build_flags =
  ${env:vest_idf.build_flags}
  -DJL_WIFI=0
  '-UBOOT_NAME -DBOOT_NAME=VEST-IDF-NO-WIFI'

# ATOM Matrix development vest build with custom FreeRTOS settings to enable instrumentation.
# This requires additional installation steps, see the Instrumentation section of DEBUGGING.md.
[env:vest_instrumentation]
extends = env:vest_timing
framework = ${env:_espidf.framework}
board_build.embed_txtfiles = ${env:_espidf.board_build.embed_txtfiles}
board_build.cmake_extra_args = ${_sdkconfig_instrumentation_iram.board_build.cmake_extra_args}
build_flags =
  ${env:vest_timing.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=INSTRUMENT'
  -DJL_INSTRUMENTATION=1

# ATOM Matrix production vest build that uses NimBLE instead of Bluedroid.
[env:vest_nimble]
extends = env:vest
lib_deps =
  ${env:vest.lib_deps}
  ${_nimble_arduino.lib_deps}
build_flags =
  ${env:vest.build_flags}
  ${_nimble_arduino.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=VEST-NIMBLE'

# Development build to test out M5 logging.
[env:vest_nimble_m5_logging]
extends = env:vest_nimble
build_flags =
  ${env:vest_nimble.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=LOG'
  -DJL_M5_LOGGING=1
lib_deps =
  ${env:vest_nimble.lib_deps}
  ${_lib_m5unified.lib_deps}

# ATOM Matrix development vest build that uses Esp32WiFiNetwork.
[env:vest_esp_wifi]
extends = env:vest_dev
build_flags =
  ${env:vest_dev.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=ESP-WIFI'
  -DJL_ESP32_WIFI=1

[env:vest_instr_esp_wifi]
extends = env:vest_instrumentation
build_flags =
  ${env:vest_instrumentation.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=INSTR-ESP-WIFI'
  -DJL_ESP32_WIFI=1

# ATOM Matrix development vest build with Arduino Ethernet support.
# TODO switch this environment to the new arduino core.
[env:vest_arduino_ethernet]
extends = env:vest_dev
lib_deps =
  ${env:vest_dev.lib_deps}
  https://github.com/DavidSchinazi/legacy-arduino-Ethernet.git#2.0.0-ds33-1
build_flags =
  ${env:vest_dev.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=A-ETH'
  -DJL_ETHERNET=1
  -DJL_ESP32_ETHERNET=0
  -DJL_ESP32_WIFI=0

# ATOM Matrix development vest build with Ethernet enabled that uses Esp32 networks.
[env:vest_esp_ethernet]
extends = env:vest_dev
build_flags =
  ${env:vest_dev.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=ESP-ETH'
  -DJL_ETHERNET=1
  -DJL_ESP32_ETHERNET=1
  -DJL_ESP32_WIFI=1

# ATOM Matrix development vest build with Ethernet enabled and Wi-Fi disabled.
[env:vest_esp_ethernet_only]
extends = env:vest_dev
build_flags =
  ${env:vest_dev.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=ETHOD'
  -DJL_ETHERNET=1
  -DJL_ESP32_ETHERNET=1
  -DJL_WIFI=0

# ATOM Matrix development vest build with Ethernet enabled and Wi-Fi disabled.
[env:vest_instr_esp_ethernet_only]
extends = env:vest_instrumentation
build_flags =
  ${env:vest_instrumentation.build_flags}
  '-UBOOT_NAME -DBOOT_NAME=ETHIOD'
  -DJL_ETHERNET=1
  -DJL_ESP32_ETHERNET=1
  -DJL_WIFI=0

# ATOM Matrix production shoe build.
[env:shoe]
extends = env:_atom_matrix
build_flags =
  ${env:_atom_matrix.build_flags}
  -DJL_CONFIG=SHOE
  -DBOOT_NAME=SHOE

