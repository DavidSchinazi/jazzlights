; WLED build environments with the JazzLights usermod, see extras/docs/WLED.md.
;
; extras/wled/build.sh copies this file into its WLED checkout in extras/.wled. To use it with another WLED
; checkout instead, copy it there as platformio_override.ini and set jazzlights.path below.
;
; Each environment extends an official WLED environment, for one of the boards that JazzLights devices use. JL_CONFIG
; and JL_CONTROLLER describe the device as in the rest of JazzLights, and the LED pins match layout_data.h. WLED's LED
; settings can still be changed from its web UI. The usermod's build script appends _JazzLights to the release name, so
; that WLED's own updates don't replace these builds with stock WLED.

[platformio]
default_envs =
  jazzlights_atom_matrix
  jazzlights_atom_s3_lite
  jazzlights_m5stamp_c3u
  jazzlights_m5_nano_c6

[jazzlights]
; Path to extras/wled, relative to the WLED checkout. This default works for the checkout made by build.sh.
path = ../wled
; WLED only recognizes an external usermod when it's on its own line of custom_usermods.
usermod = jazzlights = symlink://${jazzlights.path}

; M5Stack ATOM Matrix (ESP32, 4 MB). The ATOM's own 5x5 matrix is on GPIO 27, and the vest's 360 LEDs are on GPIO 26.
; extras/wled/generate_vest_ledmap.py makes the ledmap.json that places them both on WLED's 2D canvas.
[env:jazzlights_atom_matrix]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods}
  ${jazzlights.usermod}
build_flags = ${env:esp32dev.build_flags}
  -D JL_CONFIG=VEST
  -D JL_CONTROLLER=ATOM_MATRIX
  -D DATA_PINS=27,26
  -D PIXEL_COUNTS=25,360
  -D BTNPIN=39

; M5Stack ATOM S3 Lite (ESP32-S3, 8 MB, no PSRAM). The vest's LEDs are on GPIO 2.
[env:jazzlights_atom_s3_lite]
extends = env:esp32s3dev_8MB_none
custom_usermods = ${env:esp32s3dev_8MB_none.custom_usermods}
  ${jazzlights.usermod}
build_flags = ${env:esp32s3dev_8MB_none.build_flags}
  -D JL_CONFIG=VEST
  -D JL_CONTROLLER=ATOM_S3_LITE
  -D DATA_PINS=2
  -D BTNPIN=41

; M5Stamp C3U (ESP32-C3, 4 MB). The vest's LEDs are on GPIO 1.
[env:jazzlights_m5stamp_c3u]
extends = env:esp32c3dev
custom_usermods = ${env:esp32c3dev.custom_usermods}
  ${jazzlights.usermod}
build_flags = ${env:esp32c3dev.build_flags}
  -D JL_CONFIG=VEST
  -D JL_CONTROLLER=M5STAMP_C3U
  -D DATA_PINS=1

; M5Stack NanoC6 (ESP32-C6, 4 MB). The vest's LEDs are on GPIO 2. It has no microphone, so this leaves out WLED's
; default audioreactive usermod. Even then, Bluetooth doesn't fit in its 4 MB, so it only syncs over IP.
[env:jazzlights_m5_nano_c6]
extends = env:esp32c6dev_4MB
custom_usermods = ${jazzlights.usermod}
build_flags = ${env:esp32c6dev_4MB.build_flags}
  -D JL_CONFIG=VEST
  -D JL_CONTROLLER=M5_NANO_C6
  -D DATA_PINS=2
  -D JL_DISABLE_BLUETOOTH=1
