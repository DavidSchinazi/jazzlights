; WLED build environments with the JazzLights usermod, see extras/docs/WLED.md.
;
; extras/wled/build.sh copies this file into its WLED checkout in extras/.wled. To use it with another WLED
; checkout instead, copy it there as platformio_override.ini and set jazzlights.path below.
;
; Each environment extends an official WLED environment. The usermod's build script appends _JazzLights to the
; release name, so that WLED's own updates don't replace these builds with stock WLED.

[platformio]
default_envs =
  jazzlights_atom_matrix
  jazzlights_atom_s3_lite
  jazzlights_esp32c3
  jazzlights_esp32c6

[jazzlights]
; Path to extras/wled, relative to the WLED checkout. This default works for the checkout made by build.sh.
path = ../wled
; WLED only recognizes an external usermod when it's on its own line of custom_usermods.
usermod = jazzlights = symlink://${jazzlights.path}

; M5Stack ATOM Matrix (classic ESP32, 4 MB). The external LED strip is on GPIO 26, like the vest, and the ATOM's own 5x5
; matrix is on GPIO 27. WLED's LED settings can still be changed from its web UI.
[env:jazzlights_atom_matrix]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods}
  ${jazzlights.usermod}
build_flags = ${env:esp32dev.build_flags}
  -D DATA_PINS=26,27
  -D PIXEL_COUNTS=30,25
  -D BTNPIN=39

; M5Stack ATOM S3 Lite (ESP32-S3, 8 MB, no PSRAM). The external LED strip is on GPIO 2, like the vest.
[env:jazzlights_atom_s3_lite]
extends = env:esp32s3dev_8MB_none
custom_usermods = ${env:esp32s3dev_8MB_none.custom_usermods}
  ${jazzlights.usermod}
build_flags = ${env:esp32s3dev_8MB_none.build_flags}
  -D DATA_PINS=2
  -D BTNPIN=41

; Generic ESP32-C3 board.
[env:jazzlights_esp32c3]
extends = env:esp32c3dev
custom_usermods = ${env:esp32c3dev.custom_usermods}
  ${jazzlights.usermod}

; Generic ESP32-C6 board with 4 MB of flash.
[env:jazzlights_esp32c6]
extends = env:esp32c6dev_4MB
custom_usermods = ${env:esp32c6dev_4MB.custom_usermods}
  ${jazzlights.usermod}
build_flags = ${env:esp32c6dev_4MB.build_flags}
  -D JL_DISABLE_BLUETOOTH=1
