# ESPHome configuration for the clouds on an ATOM S3 Lite (ESP32-S3), using the JazzLights external component in
# components/jazzlights. See README.md for details. Wi-Fi credentials come from secrets.yaml.
esphome:
  name: jazzlights-clouds-s3
  friendly_name: Clouds

esp32:
  board: m5stack-atoms3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  # The ATOM S3 Lite's USB port is connected to the ESP32-S3's USB Serial/JTAG controller.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

jazzlights:

light:
  - platform: jazzlights
    name: Clouds

button:
  - platform: jazzlights
    name: Next pattern
