esphome:
  name: jazzlights-esphome-clouds-s3
  friendly_name: Clouds S3
  min_version: 2026.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  board: m5stack-atoms3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret jazzlights_esphome_clouds_s3__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: !remove

external_components:
  - source:
      type: git
      url: https://github.com/DavidSchinazi/jazzlights
      ref: main
      path: extras/esphome/components
    components: [jazzlights]
    refresh: 0s # Re-fetch the latest commit on every build.

jazzlights:

light:
  - platform: jazzlights
    name: Clouds

button:
  - platform: jazzlights
    name: Next pattern

number:
  - platform: jazzlights
    name: Max brightness
